<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gast Auswahl</title>
    <style>
        body {
            font-family: Verdana, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle at top left, rgba(255, 214, 10, 0.28), transparent 30%),
                radial-gradient(circle at bottom right, rgba(20, 81, 160, 0.15), transparent 28%),
                linear-gradient(180deg, #f8fbff 0%, #edf2f7 100%);
            padding: 20px;
            box-sizing: border-box;
        }
        .box {
            width: 100%;
            max-width: 460px;
            background: rgba(255,255,255,0.9);
            border: 1px solid rgba(15, 23, 42, 0.08);
            border-radius: 28px;
            padding: 30px;
            text-align: left;
            box-shadow: 0 18px 36px rgba(15,23,42,0.12);
            backdrop-filter: blur(10px);
        }
        .eyebrow {
            display: inline-flex;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #1451a0;
            margin-bottom: 10px;
        }
        h1 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 34px;
        }
        p {
            margin-bottom: 22px;
            color: #475569;
            font-size: 15px;
            line-height: 1.45;
        }
        .choice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .choice {
            display: block;
            text-decoration: none;
            color: #111827;
            background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
            border: 1px solid rgba(15, 23, 42, 0.08);
            border-radius: 22px;
            padding: 18px 12px;
            transition: 0.2s;
            box-shadow: 0 10px 18px rgba(15,23,42,0.06);
        }
        .choice:hover {
            background: #ffffff;
            transform: translateY(-2px);
        }
        .icon {
            font-size: 30px;
            display: block;
            margin-bottom: 8px;
        }
        .title {
            font-size: 16px;
            font-weight: bold;
        }
        .desc {
            margin-top: 6px;
            font-size: 13px;
            color: #555;
        }
        .back-btn {
            display: block;
            margin-top: 18px;
            width: 100%;
            padding: 14px;
            background: white;
            color: #111827;
            border: none;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 800;
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 10px 18px rgba(15,23,42,0.08);
        }
        .back-btn:hover { background: #f8fafc; }
        @media (max-width: 420px) {
            .choice-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="eyebrow">Gastzugang</div>
        <h1>Gastzugang</h1>
        <p>Wähle die passende Ansicht für Desktop oder Smartphone, um das System live zu beobachten.</p>
        <div class="choice-grid">
            <a href="/guest-desktop" class="choice">
                <span class="icon">🖥️</span>
                <div class="title">PC Ansicht</div>
                <div class="desc">größere Darstellung für Desktop</div>
            </a>
            <a href="/guest-mobile" class="choice">
                <span class="icon">📱</span>
                <div class="title">Handy Ansicht</div>
                <div class="desc">kompakte Ansicht für Smartphone</div>
            </a>
        </div>
        <a href="/" class="back-btn">Zurück zu Login</a>
    </div>
</body>
</html>
