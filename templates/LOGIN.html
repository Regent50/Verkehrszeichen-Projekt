<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN</title>
    <style>
        body {
            font-family: Verdana, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle at top left, rgba(255, 214, 10, 0.28), transparent 30%),
                radial-gradient(circle at bottom right, rgba(20, 81, 160, 0.15), transparent 28%),
                linear-gradient(180deg, #f8fbff 0%, #edf2f7 100%);
            padding: 20px;
            box-sizing: border-box;
        }
        #login-page {
            background: rgba(255,255,255,0.9);
            padding: 32px;
            border-radius: 28px;
            border: 1px solid rgba(15, 23, 42, 0.08);
            box-shadow: 0 18px 36px rgba(15, 23, 42, 0.12);
            width: 100%;
            max-width: 480px;
            text-align: left;
            backdrop-filter: blur(10px);
        }
        .eyebrow {
            display: inline-flex;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #1451a0;
            margin-bottom: 10px;
        }
        h2 {
            color: #111827;
            font-size: 34px;
            margin-top: 0;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 14px;
            color: #475569;
            margin-bottom: 24px;
            line-height: 1.45;
        }
        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 1px solid #cbd5e1;
            border-radius: 16px;
            font-size: 16px;
            box-sizing: border-box;
            transition: 0.2s;
            background: #f8fafc;
        }
        input:focus {
            border-color: #1451a0;
            outline: none;
            box-shadow: 0 0 0 4px rgba(20,81,160,0.12);
        }
        .section-title {
            text-align: left;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-top: 16px;
            margin-bottom: 10px;
            color: #1451a0;
        }
        .view-choice {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 18px;
        }
        .view-option {
            border: 1px solid rgba(15, 23, 42, 0.08);
            border-radius: 20px;
            padding: 14px 10px;
            background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
            box-shadow: 0 10px 18px rgba(15, 23, 42, 0.06);
            text-align: center;
        }
        .view-option:hover {
            background: #ffffff;
            transform: translateY(-1px);
        }
        .view-option.active {
            background: linear-gradient(135deg, #1451a0, #0f3f80);
            color: white;
        }
        .view-option .icon {
            font-size: 28px;
            display: block;
            margin-bottom: 8px;
        }
        .view-option .label {
            font-size: 15px;
            font-weight: bold;
        }
        .view-option .desc {
            font-size: 12px;
            margin-top: 5px;
        }
        button[type="submit"], #guest-login {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 800;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.2s;
            box-sizing: border-box;
            box-shadow: 0 10px 18px rgba(15, 23, 42, 0.08);
        }
        button[type="submit"] {
            background: linear-gradient(135deg, #1451a0, #0f3f80);
            color: white;
            margin-top: 6px;
        }
        button[type="submit"]:hover { opacity: 0.95; }
        #guest-login {
            margin-top: 14px;
            background-color: white;
            color: #111827;
        }
        #guest-login:hover { background-color: #f8fafc; }
        .error-message {
            color: #c40000;
            margin-top: 14px;
            font-size: 14px;
            font-weight: bold;
        }
        @media (max-width: 420px) {
            #login-page { padding: 22px 18px; }
            .view-choice { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="login-page">
        <div class="eyebrow">Dynamische Verkehrszeichen</div>
        <h2>LOGIN</h2>
        <div class="subtitle">Melde dich an und wähle danach die passende Ansicht für Desktop oder Mobilgerät.</div>

        <form method="POST">
            <input type="text" name="username" placeholder="Benutzername" required>
            <input type="password" name="password" placeholder="Passwort" required>

            <div class="section-title">Ansicht auswählen</div>

            <div class="view-choice">
                <div class="view-option active" onclick="setView('desktop', this)">
                    <span class="icon">🖥️</span>
                    <div class="label">PC</div>
                    <div class="desc">volle Desktop Ansicht</div>
                </div>

                <div class="view-option" onclick="setView('mobile', this)">
                    <span class="icon">📱</span>
                    <div class="label">Handy</div>
                    <div class="desc">kompakte mobile Ansicht</div>
                </div>
            </div>

            <input type="hidden" name="view_mode" id="view_mode" value="desktop">

            <button type="submit">Einloggen</button>
        </form>

        <button id="guest-login" onclick="loginAsGuest()">Als Gast anmelden</button>

        {% if error %}
        <div class="error-message">Falscher Benutzername oder Passwort</div>
        {% endif %}
    </div>

    <script>
        function setView(mode, element) {
            document.getElementById("view_mode").value = mode;
            document.querySelectorAll(".view-option").forEach(function(option) {
                option.classList.remove("active");
            });
            element.classList.add("active");
        }

        function loginAsGuest() {
            window.location.href = "/guest";
        }
    </script>
</body>
</html>
